<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Countdown | Event Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="background-animation"></div>

        <div class="content">
            <h1 class="title">Birthday Countdown</h1>
            <p class="subtitle">Track your special day with precision</p>
            
            <div class="input-section">
                <div class="input-wrapper">
                    <label for="birthdayInput">Select Your Birthday</label>
                    <input type="date" id="birthdayInput" placeholder="MM/DD/YYYY" />
                </div>
                <button id="setButton" class="btn-primary">Set Date</button>
            </div>

            <div class="countdown-container">
                <div class="countdown-card">
                    <div class="card-content">
                        <span class="number" id="days">0</span>
                        <span class="label">Days</span>
                    </div>
                </div>

                <div class="countdown-card">
                    <div class="card-content">
                        <span class="number" id="hours">0</span>
                        <span class="label">Hours</span>
                    </div>
                </div>

                <div class="countdown-card">
                    <div class="card-content">
                        <span class="number" id="minutes">0</span>
                        <span class="label">Minutes</span>
                    </div>
                </div>

                <div class="countdown-card">
                    <div class="card-content">
                        <span class="number" id="seconds">0</span>
                        <span class="label">Seconds</span>
                    </div>
                </div>
            </div>

            <div class="status-message" id="message"></div>
        </div>

        <div class="celebration-overlay" id="celebration"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
